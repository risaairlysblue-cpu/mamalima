<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="images/logo-mark.png">
<title>カレンダー | MamaLima Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div data-include="components/header.html"></div>

<section>
  <div class="wrap">
    <h1 class="section-title">カレンダー</h1>
    <p class="section-sub">最新のイベント・ワークショップの予定です。日付をタップすると詳細にジャンプします。</p>

    <div class="calendar-layout">
      <div class="calendar" data-calendar="full" data-list-target="#event-list" data-detail-target="#day-detail">
        <div class="calendar-head">
          <button class="prev-month" aria-label="前の月">‹</button>
          <span class="month-label"></span>
          <button class="next-month" aria-label="次の月">›</button>
        </div>
        <div class="calendar-grid"></div>

        <ul class="calendar-legend">
          <li><i class="mark mark-private"></i>個別レッスン <span>90分 ¥12,000</span></li>
          <li><i class="mark mark-group"></i>グループレッスン <span>¥6,000</span></li>
          <li><i class="mark mark-nukumori"></i>ぬくもり発達相談会 <span>¥1,000</span></li>
          <li><i class="mark mark-school"></i>出張レッスン</li>
          <li><i class="mark mark-full">満</i>満席（その日の枠がすべて埋まっています）</li>
        </ul>
      </div>

      <div id="day-detail" class="day-detail">
        <p class="detail-hint">印のついた日をタップすると、その日の予定が表示されます。</p>
      </div>
    </div>

    <h2 class="section-title" style="margin-top:2.4em;">今後のイベント</h2>
    <p class="section-sub">ぬくもり発達相談会とグループレッスンのご案内です。<br>個別レッスンの空き日は、上のカレンダーでご確認ください。</p>
    <div id="event-list" class="event-list"></div>

    <p class="center" style="margin-top:2.4em;">
      <a href="nukumori.html" class="link-arrow">地域子育て支援「ぬくもり」について →</a>
    </p>
  </div>
</section>

<div data-include="components/footer.html"></div>
<script src="js/main.js"></script>
</body>
</html>
